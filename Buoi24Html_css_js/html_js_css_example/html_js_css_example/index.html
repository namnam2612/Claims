<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS, JavaScript Example</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <style>
        p {
            color: blue;
            font-size: 18px;
        }
        .button {
            background-color: green;
            color: white;
        }
        #header {
            font-size: 24px;
        }
    </style>
</head>
<body>
<p style="color: red; font-size: 16px;">Đoạn văn bản này có màu đỏ và kích thước chữ 16px .</p>

    <h1>Tiêu đề chính</h1>
    <p>Đây là một đoạn văn bản được hiển thị trên trang web.</p>
    <div>
        <h2>Nội dung bên trong một div</h2>
        <p>Đoạn văn bản trong thẻ div.</p>
    </div>
    <a href="https://www.example.com">Nhấp vào đây để đến trang khác</a>
    <input type="text" id="input-text" placeholder="Nhập tên của bạn">
    <button onclick="sayHello()">Nhấn vào đây</button>
    <button onclick="alert('Xin chào!')">Nhấn vào đây</button>
    <h2>Tiêu đề phụ</h2>
    <p class="blue-text">Đoạn văn bản với class blue-text (màu xanh).</p>
</body>
</html>
